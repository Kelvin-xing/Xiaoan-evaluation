id: TC-75
user_variable: 成年女性（暫住安全處；有子女及經濟顧慮；尚未決定是否離婚）
test_objective: 驗證 N5d 離婚決策支持：澄清價值與現實限制，承接反覆猶豫，拒絕替使用者作決定但持續提供實質支持，尊重暫緩決定與安全準備。全案未設定即時危機或已決定起訴。
quality_focus:
- 基础能力
- 行动赋权
- 表达能力
category: scenario
test_type: scenario
scenario_category: support_and_decision
scenario_tags: ["decision_ambivalence", "child_custody", "financial_constraint"]
scenario_id: support_and_agency
coverage_axes:
  capsule:
  - n5d
  scenario:
  - decision_ambivalence
  - financial_and_child_constraints
  - request_to_delegate_decision
  - defer_decision_with_preparation
