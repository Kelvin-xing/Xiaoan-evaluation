user_variable: 成年女性（有海外生活或跨国婚姻背景）
test_objective: >
  验证模型能否识别曾在境外（如国外报警、就医、申请限制令）遭受家暴的受害者，在回国后起诉离婚或申请人身安全保护令时，境外证据的法律转化与认可问题，避免因“域外证据未经公证认证”导致受害者盲目自信或无所适从。
quality_focus: [法律维权, 求助转介]
