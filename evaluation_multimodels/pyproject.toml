[project]
name = "xiaoan-eval"
version = "0.1.0"
description = "Lightweight evaluation framework for the XiaoAn RAG pipeline"
requires-python = ">=3.11"
dependencies = ["OpenAI>=2.43.0", "PyYAML>=6.0", "openpyxl>=3.1,<4"]

[project.scripts]
xiaoan-eval = "xiaoan_eval.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["xiaoan_eval", "xiaoan_eval_core", "xiaoan_evaluator_config", "evaluation_report_agent"]
py-modules = ["company_eval_plugins"]

[tool.setuptools.package-data]
xiaoan_eval = ["report_metric_dictionary.md"]
xiaoan_evaluator_config = ["prompts/*.md", "schemas/*.json", "*.json", "*.yml", "examples/*", "calibration/*.md"]
evaluation_report_agent = ["prompts/*.md"]

[tool.setuptools.package-dir]
xiaoan_eval_core = "../evaluation/xiaoan_eval_core"
xiaoan_eval = "../evaluation/xiaoan_eval"
xiaoan_evaluator_config = "../evaluation/evaluator-config"
evaluation_report_agent = "../evaluation_report_agent"
